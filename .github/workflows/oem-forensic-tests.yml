name: OEM forensic reader regression
on:
  push:
    branches:
      - forensic/iter003-parcel-boundaries
      - forensic/iter004-header-evidence
      - forensic/iter005-size-constraints
      - forensic/iter006-cross-release
      - forensic/iter007-three-release
      - forensic/iter008-init-spans
      - forensic/iter009-init-table-contents
      - forensic/iter010-real-map-and-iso
      - forensic/iter011-oem-iso-layout
      - forensic/iter012-oem-kd-index
  pull_request:
    paths:
      - 'tools/oem_*.py'
      - 'tests/test_oem_*.py'
      - '.github/workflows/oem-forensic-tests.yml'

jobs:
  evidence-reader:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python3 -m compileall -q tools/oem_inventory.py tools/oem_catalog_decoder.py tools/oem_block_provenance.py tools/oem_parcel_boundaries.py tools/oem_header_evidence.py tools/oem_size_constraints.py tools/oem_cross_version.py tools/oem_init_spans.py tools/oem_init_pair_tables.py tools/oem_real_map_probe.py tools/oem_iso_layout.py
      - name: Run offline forensic regression tests
        run: python3 -m unittest discover -s tests -p 'test_oem_*.py' -v
