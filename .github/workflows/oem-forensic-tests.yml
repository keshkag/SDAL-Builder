name: OEM forensic reader regression
on:
  push:
    branches:
      - forensic/iter003-parcel-boundaries
      - forensic/iter004-header-evidence
      - forensic/iter005-size-constraints
      - forensic/iter006-cross-release
      - forensic/iter007-three-release
      - forensic/iter008-init-spans
      - forensic/iter009-init-table-contents
      - forensic/iter010-real-map-and-iso
      - forensic/iter011-oem-iso-layout
      - forensic/iter012-oem-kd-index
      - forensic/iter013-kd-graph-integrity
      - forensic/iter014-content-iso-bridge
      - forensic/iter015-kd-all-root-integrity
      - forensic/iter016-root-clusters
      - forensic/iter017-spec-correct-kd
      - forensic/iter018-descriptor-encoder
      - forensic/iter019-spec-spatial-plan
      - forensic/iter020-typed-parcel-records
      - forensic/iter021-line-segment-geometry
      - forensic/iter022-typed-parcel-assembly
      - forensic/iter023-global-size-allocator
  pull_request:
    paths:
      - 'tools/oem_*.py'
      - 'tests/test_oem_*.py'
      - '.github/workflows/oem-forensic-tests.yml'

jobs:
  evidence-reader:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell entrypoint syntax
        run: bash -n build.sh
      - name: Check Python syntax
        run: python3 -m compileall -q tools/oem_inventory.py tools/oem_catalog_decoder.py tools/oem_block_provenance.py tools/oem_parcel_boundaries.py tools/oem_header_evidence.py tools/oem_size_constraints.py tools/oem_cross_version.py tools/oem_init_spans.py tools/oem_init_pair_tables.py tools/oem_real_map_probe.py tools/oem_iso_layout.py tools/oem_kd_graph_integrity.py tools/oem_kd_root_coverage.py tools/oem_kd_all_root_integrity.py tools/oem_kd_similarity_clusters.py tools/oem_kd_complete_graph.py tools/oem_spatial_encoder_parity.py tools/oem_maneuver_pid_spec_audit.py src/sdal_builder/osm_spatial_plan.py src/sdal_builder/oem_spatial_header.py src/sdal_builder/oem_typed_headers.py src/sdal_builder/oem_typed_records.py src/sdal_builder/oem_record_blocks.py src/sdal_builder/oem_line_geometry.py src/sdal_builder/oem_route_segments.py src/sdal_builder/osm_road_encoding.py src/sdal_builder/oem_parcel_assembly.py src/sdal_builder/oem_media_allocator.py tools/oem_media_size_evidence.py tools/oem_line_segment_evidence.py tools/oem_typed_parcel_evidence.py src/sdal_builder/oem_kd_codec.py src/sdal_builder/iso.py
      - name: Install hybrid ISO mastering tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq genisoimage
      - name: Run offline forensic regression tests
        run: python3 -m unittest discover -s tests -p 'test_oem_*.py' -v

  macos-hybrid-mastering:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cdrtools
        run: brew install cdrtools
      - name: Exercise mkisofs hybrid mastering and byte-parity tests
        run: python3 -m unittest discover -s tests -p 'test_oem_hybrid_mastering.py' -v
